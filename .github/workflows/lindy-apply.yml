name: Lindy Apply Changes

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to create/update'
        required: true
        default: 'lindy-improvements'
      base_branch:
        description: 'Base branch'
        required: true
        default: 'main'
      file_path:
        description: 'File path to create/update'
        required: true
      file_content_b64:
        description: 'File content (base64-encoded)'
        required: true
      commit_message:
        description: 'Commit message'
        required: true
        default: 'chore: lindy update'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.base_branch }}
          token: ${{ secrets.PAT_LINDY }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "lindy-bot"
          git config user.email "lindy-bot@users.noreply.github.com"

      - name: Create or switch to working branch
        run: |
          git fetch origin
          if git ls-remote --exit-code --heads origin "${{ github.event.inputs.branch }}"; then
            git checkout -B "${{ github.event.inputs.branch }}" "origin/${{ github.event.inputs.branch }}"
          else
            git checkout -b "${{ github.event.inputs.branch }}"
          fi

      - name: Write file
        run: |
          mkdir -p "$(dirname "${{ github.event.inputs.file_path }}")"
          echo "${{ github.event.inputs.file_content_b64 }}" | base64 -d > "${{ github.event.inputs.file_path }}"

      - name: Commit and push
        run: |
          git add "${{ github.event.inputs.file_path }}"
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "${{ github.event.inputs.commit_message }}"
          git push origin "${{ github.event.inputs.branch }}"
