# Nginx vhost for the client portal behind Cloudflare.
# Path: /etc/nginx/sites-available/portal.aepovcg.pro
# Symlink: /etc/nginx/sites-enabled/portal.aepovcg.pro
#
# Same model as nginx-aepovcg.conf — HTTP-only on port 80, Cloudflare
# does TLS termination.

server {
    listen 80;
    listen [::]:80;
    server_name portal.aepovcg.pro;

    access_log /var/log/nginx/portal.access.log;
    error_log  /var/log/nginx/portal.error.log;

    # Bare hostname lands on /portal directly.
    location = / {
        return 302 /portal;
    }

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 60s;
    }
}
