# Nginx vhost for the marketing portfolio behind Cloudflare.
# Path: /etc/nginx/sites-available/aepovcg.pro
# Symlink: /etc/nginx/sites-enabled/aepovcg.pro
#
# This origin server only ever speaks HTTP on port 80. Cloudflare
# terminates HTTPS on its edge and forwards plain HTTP to us. The
# scheme the browser saw is in the X-Forwarded-Proto header (sent by
# Cloudflare). Next.js reads it via headers() so server-side links
# generate https:// URLs.
#
# Port 443 on this host is owned by xray (VPN masking) and we do not
# touch it. Keeping nginx on port 80 only avoids the conflict
# entirely.

server {
    listen 80;
    listen [::]:80;
    server_name aepovcg.pro www.aepovcg.pro;

    access_log /var/log/nginx/aepovcg.access.log;
    error_log  /var/log/nginx/aepovcg.error.log;

    # Anything portal-related is served exclusively from the portal
    # subdomain so cookies / Supabase callbacks have one canonical
    # origin. Hard-redirect to the portal host (Cloudflare upgrades it
    # to HTTPS).
    location /portal {
        return 301 https://portal.aepovcg.pro$request_uri;
    }
    location /auth {
        return 301 https://portal.aepovcg.pro$request_uri;
    }

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Cloudflare always sends X-Forwarded-Proto: https in Flexible
        # mode. Force it here so direct origin hits also look HTTPS to
        # the app (CF allowlist can be added later if we want to lock
        # the origin down).
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 60s;
    }
}
