# Nginx vhost for the marketing portfolio.
# Path: /etc/nginx/sites-available/aepovcg.online
# Symlink: /etc/nginx/sites-enabled/aepovcg.online
#
# Adjust SSL paths to wherever you keep your certs. The example below
# expects /etc/ssl/aepovcg/ but you can also use /etc/letsencrypt/live/.
#
# nginx -t && systemctl reload nginx after editing.

# Redirect plain HTTP to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name aepovcg.online www.aepovcg.online;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — marketing portfolio.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aepovcg.online www.aepovcg.online;

    ssl_certificate     /etc/ssl/aepovcg/fullchain.pem;
    ssl_certificate_key /etc/ssl/aepovcg/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    access_log /var/log/nginx/aepovcg.access.log;
    error_log  /var/log/nginx/aepovcg.error.log;

    # Anything portal-related is served exclusively from the portal
    # subdomain so cookies / Supabase callbacks have one canonical
    # origin. Hard-redirect to the portal vhost.
    location /portal {
        return 301 https://portal.aepovcg.online$request_uri;
    }
    location /auth {
        return 301 https://portal.aepovcg.online$request_uri;
    }

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 60s;
    }
}
